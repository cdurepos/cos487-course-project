# Evaluation settings for `python -m apps.evaluation.evaluate`
# Edit this file, then re-run from the repository root.

# Team name used in the submitted run filenames and TREC run tag:
#   <team_name>_<level>_<method>_<set>.tsv
# e.g. TheSearchParty_paper_bm25_study.tsv
team_name: TheSearchParty

# Query sets to retrieve, in order. Each entry names a query file under data/.
#   name:  study | test
#   score: true measures that set against its qrels and writes metrics.
#          false writes TREC runs only. A missing qrel file is an error when
#          score is true, so do not turn scoring off to hide a missing file.
sets:
  - name: study
    score: true
  - name: test
    score: false

# Index levels to evaluate (one or both).
# Allowed values per item: paper | paragraph
levels:
  - paper
  - paragraph

# Retrieval systems to run and compare.
# Allowed values per item: bm25 | tfidf
methods:
  - bm25
  - tfidf

# How many documents to retrieve per query (TREC run length).
# Allowed values: any integer >= 1 (typical: 10, 100)
k: 100

# Whether to use stemmed indexes. Setting this to false writes "_no-stem" ablation files.
# Allowed values: true | false
stem: true

# Cap how many queries to evaluate.
# Allowed values: null (all queries) | integer >= 1 (e.g. 10 for a smoke test)
limit: null

# Metrics to compute with ranx, counting both Relevant (grade 2) and
# Partially Relevant (grade 1) as relevant.
#
# Allowed values (common):
#   ndcg, ndcg@5, ndcg@10          graded, so unaffected by the pass below
#   mrr
#   precision@5, precision@10
#   map, recall@10, recall@100, hit_rate@10
# See the ranx docs for the full list.
metrics:
  - ndcg
  - ndcg@5
  - mrr
  - precision@5
  - precision@10

# Metrics recomputed with only Relevant (grade 2) counting as relevant, via
# qrels.set_relevance_level(rel_lvl=2). The course asks for both variants of
# MRR and Precision@5; leave this empty to skip the second pass.
# Allowed values: same names as `metrics` above.
strict_metrics:
  - mrr
  - precision@5

# Paired significance test between each pair of methods, reported per metric as
# a p-value plus which method is better (or none, when the gap is not significant).
# Allowed values for stat_test: student | fisher
# Allowed values for max_p: any float between 0 and 1 (typical: 0.05, 0.01)
stat_test: student
max_p: 0.05
