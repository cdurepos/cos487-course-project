
team_name: TheSearchParty

sets:
  - {name: study, metrics: true}
  - {name: test, metrics: false}

levels: [paper, paragraph]
k: 100

models:
  sparse:
    checkpoint: models/splade
    index_path: data/indexes/splade
    type: sparse
    max_tokens: 256
    normalized: true
    compare_pooling: true
    
sparse-baseline:
    checkpoint: naver/splade-v3
    index_path: data/indexes/splade-baseline
    type: sparse
    max_tokens: 256
    normalized: true
    compare_pooling: true
    save_run: false

baseline_methods: [bm25]
stem: true

metrics: [ndcg, ndcg@5, mrr, precision@5, precision@10]
strict_metrics: [mrr, precision@5]

stat_test: student
max_p: 0.05
