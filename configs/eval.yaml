team_name: TheSearchParty

sets:
  - {name: study, metrics: true}
  - {name: test, metrics: false}

levels: [paper, paragraph]
k: 100

models:
  splade-finetuned:
    type: sparse

  splade-baseline:
    type: sparse
    save_run: false

  qwen-finetuned:
    type: dense
    training: finetuned

  qwen-pretrained:
    type: dense
    training: pretrained

baseline_methods: [bm25]
stem: true

metrics: [ndcg, ndcg@5, mrr, precision@5, precision@10]
strict_metrics: [mrr, precision@5]

stat_test: student
max_p: 0.05
